# Mosquitto example for Vision Sentinel pure browser WebSocket control.
# Put the real config on the MQTT broker host, for example 192.168.2.13.
#
# TCP MQTT for terminal / backend clients:
#   mosquitto_pub -h 192.168.2.13 -p 1883 -t vision-sentinel/control -m '{"command":"head_down"}'
#
# WSS MQTT for HTTPS browser pages:
#   wss://192.168.2.13:8084/mqtt

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

listener 8084 0.0.0.0
protocol websockets
allow_anonymous true

# Browser WSS requires a certificate trusted by the browser.
# Replace these paths with the real certificate and key on 192.168.2.13.
certfile /etc/mosquitto/certs/vision-sentinel-mqtt.crt
keyfile /etc/mosquitto/certs/vision-sentinel-mqtt.key
