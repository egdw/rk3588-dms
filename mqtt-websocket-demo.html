<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vision Sentinel MQTT WebSocket Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #0b1220;
      color: #e5eefc;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: min(760px, calc(100vw - 32px));
      padding: 24px;
      border: 1px solid #26324a;
      border-radius: 8px;
      background: #111827;
      box-shadow: 0 24px 70px #0008;
    }
    h1 { margin: 0 0 18px; font-size: 22px; }
    label { display: grid; gap: 8px; margin: 12px 0; color: #9fb0c9; font-weight: 700; }
    input {
      width: 100%;
      border: 1px solid #34425e;
      border-radius: 6px;
      padding: 10px 12px;
      background: #07101f;
      color: #e5eefc;
      font: inherit;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    button {
      min-height: 40px;
      border: 1px solid #3f8cff;
      border-radius: 6px;
      padding: 0 14px;
      background: #1d4ed8;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }
    button.secondary { border-color: #475569; background: #1f2937; }
    button.danger { border-color: #ef4444; background: #b91c1c; }
    button:disabled { cursor: not-allowed; opacity: 0.48; }
    pre {
      min-height: 170px;
      margin: 18px 0 0;
      padding: 14px;
      overflow: auto;
      border: 1px solid #26324a;
      border-radius: 6px;
      background: #050b16;
      color: #b8c7dd;
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>MQTT WebSocket 控制演示</h1>
    <label>
      WebSocket MQTT 地址
      <input id="url" value="wss://192.168.2.13:8084/mqtt" />
    </label>
    <label>
      Topic
      <input id="topic" value="vision-sentinel/control" />
    </label>
    <div class="actions">
      <button id="connect">连接</button>
      <button data-command="manual_enter" disabled>进入手动</button>
      <button data-command="head_down" disabled>低头</button>
      <button data-command="drowsy" disabled>闭眼</button>
      <button data-command="phone" disabled>打电话</button>
      <button class="danger" data-command="manual_exit" disabled>退出手动</button>
      <button class="secondary" id="disconnect" disabled>断开</button>
    </div>
    <pre id="log"></pre>
  </main>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const commandButtons = [...document.querySelectorAll("[data-command]")];
    const logBox = $("#log");
    let socket = null;
    let pingTimer = null;
    let connected = false;

    function log(message) {
      const time = new Date().toLocaleTimeString("en-US", { hour12: false });
      logBox.textContent = `[${time}] ${message}\n${logBox.textContent}`;
    }

    function setConnected(value) {
      connected = value;
      $("#connect").disabled = value;
      $("#disconnect").disabled = !value;
      commandButtons.forEach((button) => { button.disabled = !value; });
    }

    function clearPingTimer() {
      if (pingTimer) window.clearInterval(pingTimer);
      pingTimer = null;
    }

    function mqttString(value) {
      const bytes = new TextEncoder().encode(String(value));
      return [bytes.length >> 8, bytes.length & 255, ...bytes];
    }

    function remainingLength(value) {
      const bytes = [];
      let next = value;
      do {
        let encoded = next % 128;
        next = Math.floor(next / 128);
        if (next > 0) encoded |= 128;
        bytes.push(encoded);
      } while (next > 0);
      return bytes;
    }

    function packet(typeAndFlags, body) {
      return new Uint8Array([typeAndFlags, ...remainingLength(body.length), ...body]);
    }

    function connectPacket(clientId) {
      return packet(0x10, [
        ...mqttString("MQTT"),
        4,
        2,
        0,
        30,
        ...mqttString(clientId),
      ]);
    }

    function publishPacket(topic, text) {
      const payload = [...new TextEncoder().encode(text)];
      return packet(0x30, [...mqttString(topic), ...payload]);
    }

    function pingPacket() {
      return new Uint8Array([0xc0, 0]);
    }

    $("#connect").addEventListener("click", () => {
      const url = $("#url").value.trim();
      if (!url) return;
      if (window.location.protocol === "https:" && url.startsWith("ws://")) {
        log("当前页面是 HTTPS, Chrome 可能会拦截 ws:// 连接; 如果连接失败,需要用 HTTP 页面或 WSS");
      }
      clearPingTimer();
      socket?.close();
      try {
        socket = new WebSocket(url, "mqtt");
      } catch (error) {
        log(`WebSocket 创建失败: ${error.message}`);
        return;
      }
      socket.binaryType = "arraybuffer";
      socket.onopen = () => {
        const clientId = `vision-demo-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
        socket.send(connectPacket(clientId));
        log(`WebSocket 已打开: ${url}, protocol=${socket.protocol || "未协商"}`);
      };
      socket.onmessage = async (event) => {
        let buffer = null;
        if (event.data instanceof ArrayBuffer) {
          buffer = event.data;
        } else if (typeof Blob !== "undefined" && event.data instanceof Blob) {
          buffer = await event.data.arrayBuffer();
        } else if (typeof event.data === "string") {
          buffer = new TextEncoder().encode(event.data).buffer;
        }
        if (!buffer) return;
        const bytes = new Uint8Array(buffer);
        const packetType = bytes[0] >> 4;
        if (packetType === 2) {
          setConnected(true);
          log("MQTT CONNACK 已收到,可以发送命令");
          clearPingTimer();
          pingTimer = window.setInterval(() => {
            if (socket?.readyState === WebSocket.OPEN) socket.send(pingPacket());
          }, 15000);
        }
      };
      socket.onclose = (event) => {
        clearPingTimer();
        setConnected(false);
        log(`连接已断开: code=${event.code}, clean=${event.wasClean}, reason=${event.reason || "无"}`);
      };
      socket.onerror = () => {
        log("连接错误: 如果 code=1006,优先检查证书信任、Chrome 重启、WSS 地址和 Mosquitto 日志");
      };
    });

    $("#disconnect").addEventListener("click", () => {
      clearPingTimer();
      socket?.close();
    });

    commandButtons.forEach((button) => {
      button.addEventListener("click", () => {
        if (!connected || socket?.readyState !== WebSocket.OPEN) return;
        const message = JSON.stringify({ command: button.dataset.command });
        socket.send(publishPacket($("#topic").value.trim(), message));
        log(`已发送 ${$("#topic").value.trim()} ${message}`);
      });
    });
  </script>
</body>
</html>
